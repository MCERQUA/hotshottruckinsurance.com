<!--
  Static form definitions for Netlify form detection.
  Netlify scans this file at build time to register the "quote" and "contact"
  forms. The actual interactive forms live in /quote and /contact and post the
  same field names. This file is not linked from the UI.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input type="text" name="name" />
  <input type="text" name="businessName" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="state" />
  <input type="text" name="serviceType" />
  <input type="text" name="yearsInBusiness" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
  <input name="date_of_birth" />
  <input name="street_address" />
  <input name="drivers_license_number" />
  <input name="drivers_license_issue_date" />
  <input name="drivers_license_expiration_date" />
  <textarea name="driver_names"></textarea>
  <input name="vehicle_year" />
  <input name="vehicle_make" />
  <input name="vehicle_model" />
  <textarea name="vehicle_vin"></textarea>
  <input name="vehicle_value" />
  <textarea name="accessories_description"></textarea>
  <input name="accessories_value" />
  <input name="current_policy_start_date" />
  <input name="current_policy_expiration_date" />
  <input name="current_coverage_limits" />
  <input name="prior_auto_insurance" />
  <input name="coverage_type" />
  <input type="date" name="effective_date" />
  <input name="limits_requested" />
  <input name="gross_revenue" />
  <input type="number" name="losses_3yr_count" />
  <textarea name="losses_3yr_details"></textarea>
  <input type="text" name="entityType" />
  <input type="text" name="drivers_license_state" />
  <input type="text" name="fein" />
  <input type="text" name="physicalCounty" />
  <input type="text" name="currentCarrier" />
  <input type="text" name="usdotNumber" />
  <input type="text" name="mcNumber" />
  <input type="radio" name="mailing_same_as_physical" value="Yes" />
  <input type="radio" name="mailing_same_as_physical" value="No" />
  <input type="text" name="mailing_state" />
  <input type="text" name="additionalInsuredState" />
  <input type="date" name="certificateNeededBy" />
  <input type="number" name="fullTimeEmployees" />
  <input type="number" name="partTimeEmployees" />
  <input type="number" name="yearsInBusinessNumber" />
  <input type="number" name="annualRevenue" />
  <input type="text" name="mailing_street_address" />
  <input type="text" name="mailing_city" />
  <input type="text" name="mailing_county" />
  <input type="text" name="mailing_zip" />
  <input type="text" name="additionalInsuredName" />
  <input type="text" name="additionalInsuredAddress" />
  <input type="text" name="additionalInsuredCity" />
  <input type="text" name="additionalInsuredZip" />
  <input type="date" name="loss1Date" />
  <input type="text" name="loss1LineOfBusiness" />
  <input type="number" name="loss1Amount" />
  <input type="text" name="loss1Status" />
  <input type="date" name="loss2Date" />
  <input type="text" name="loss2LineOfBusiness" />
  <input type="number" name="loss2Amount" />
  <input type="text" name="loss2Status" />
  <input type="date" name="loss3Date" />
  <input type="text" name="loss3LineOfBusiness" />
  <input type="number" name="loss3Amount" />
  <input type="text" name="loss3Status" />

                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">City</label>
                            <input type="text" name="city" autocomplete="address-level2" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.25rem; box-sizing: border-box;" required>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">ZIP Code</label>
                            <input type="text" name="zip" inputmode="numeric" autocomplete="postal-code" pattern="\d{5}(-\d{4})?" maxlength="10" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.25rem; box-sizing: border-box;" required>
                        </div></form>

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="subject" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
</form>
